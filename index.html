<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박문지부 영무궁화 연찬회</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    background:linear-gradient(135deg,#fff8fb 0%,#f4fbff 50%,#fffdf5 100%);
    color:#5c5964;
  }
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 42px}
  h1{
    margin:8px 0 22px;text-align:center;font-size:clamp(24px,5vw,38px);
    color:#75647c;letter-spacing:-1.5px;
  }
  .card{
    background:rgba(255,255,255,.86);border:1px solid #eadfea;
    border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(110,90,120,.10);
  }
  .home-screen{text-align:center}
  .main-photo{
    display:block;width:100%;max-width:760px;max-height:62vh;object-fit:contain;
    margin:0 auto;border-radius:18px;background:#faf7fb;
    box-shadow:0 5px 18px rgba(90,80,100,.10);
  }
  .click{
    display:inline-block;margin:20px auto 4px;padding:13px 34px;border-radius:999px;
    background:#f3dff0;color:#725d70;font-weight:800;font-size:18px;
    cursor:pointer;box-shadow:0 5px 12px rgba(150,110,150,.12);
    transition:.18s;
  }
  .click:hover{transform:translateY(-2px);background:#ecd5e9}
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;
  }
  .person{
    border:1px solid #eadfea;border-radius:20px;padding:18px 8px 14px;
    background:linear-gradient(180deg,#fff,#fff8fc);
    cursor:pointer;transition:.18s;box-shadow:0 5px 14px rgba(110,90,120,.07);
  }
  .person:hover{transform:translateY(-3px);box-shadow:0 9px 18px rgba(110,90,120,.12)}
  .dessert{font-size:48px;line-height:1.05}
  .num{margin-top:10px;font-size:16px;font-weight:800;color:#746875}
  .name{margin-top:5px;color:#aaa1aa;font-size:14px}
  .viewer{text-align:center}
  .viewer-title{font-size:20px;font-weight:800;color:#77677a;margin:2px 0 14px}
  .slide-box{
    min-height:55vh;display:flex;align-items:center;justify-content:center;
    background:#fbf9fc;border-radius:18px;padding:10px;
  }
  .slide{
    max-width:100%;max-height:65vh;object-fit:contain;border-radius:12px;
  }
  .controls{
    display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap;
  }
  button{
    border:0;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:800;
    cursor:pointer;background:#e8eef9;color:#5d6679;
  }
  button.next{background:#f2d9e8;color:#755b6b}
  button.home{background:#e3f1eb;color:#5e7168}
  button:disabled{opacity:.4;cursor:default}
  .counter{margin-right:auto;align-self:center;color:#aaa0ab;font-size:14px}
  .hidden{display:none!important}
  @media(max-width:560px){
    .wrap{padding:15px 10px 28px}
    .card{padding:12px;border-radius:18px}
    .grid{gap:9px}
    .person{padding:14px 4px 11px;border-radius:16px}
    .dessert{font-size:38px}
    .slide-box{min-height:55vh}
    .counter{width:100%;text-align:center}
    .controls{justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>박문지부 영무궁화 연찬회</h1>

  <section id="home" class="card home-screen">
    <img id="mainPhoto" class="main-photo" src="박문 사진/슬라이스1.png" alt="연찬회 안내 사진"
         onerror="this.alt='슬라이스1.png 파일을 찾을 수 없습니다';">
    <div class="click" onclick="showMembers()">👆 클릭</div>
  </section>

  <section id="members" class="card hidden">
    <div class="grid" id="memberGrid"></div>
  </section>

  <section id="viewer" class="card viewer hidden">
    <div id="viewerTitle" class="viewer-title"></div>
    <div class="slide-box">
      <img id="slideImage" class="slide" alt="연찬회 사진">
    </div>
    <div class="controls">
      <div id="counter" class="counter"></div>
      <button id="prevBtn" onclick="prevSlide()">← 이전</button>
      <button class="next" id="nextBtn" onclick="nextSlide()">다음 →</button>
      <button class="home" onclick="goHome()">🏠 첫 화면</button>
    </div>
  </section>
</div>

<script>
const groups = [
  {num:1, emoji:"🍰", range:[2,11]},
  {num:2, emoji:"🍮", range:[12,20]},
  {num:3, emoji:"🍩", range:[21,27]},
  {num:4, emoji:"🧁", range:[28,33]},
  {num:5, emoji:"🍪", range:[34,42]},
  {num:6, emoji:"🍓", range:[43,51]},
  {num:7, emoji:"🍨", range:[52,60]},
  {num:8, emoji:"🍫", range:[61,70]},
  {num:9, emoji:"🍧", range:[71,78]}
];

let currentGroup = null;
let currentIndex = 0;

const home = document.getElementById("home");
const members = document.getElementById("members");
const viewer = document.getElementById("viewer");
const slideImage = document.getElementById("slideImage");
const viewerTitle = document.getElementById("viewerTitle");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const grid = document.getElementById("memberGrid");
groups.forEach(g => {
  const el = document.createElement("div");
  el.className = "person";
  el.innerHTML = `<div class="dessert">${g.emoji}</div>
                 <div class="num">${g.num}번</div>
                 <div class="name">( 이름 )</div>`;
  el.onclick = () => openGroup(g.num);
  grid.appendChild(el);
});

function showMembers(){
  home.classList.add("hidden");
  viewer.classList.add("hidden");
  members.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function openGroup(num){
  currentGroup = groups.find(g => g.num === num);
  currentIndex = 0;
  members.classList.add("hidden");
  viewer.classList.remove("hidden");
  updateSlide();
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateSlide(){
  const [start,end] = currentGroup.range;
  const number = start + currentIndex;
  slideImage.src = `박문 사진/슬라이스${number}.png`;
  slideImage.alt = `${number}번 사진`;
  viewerTitle.textContent = `${currentGroup.num}번 · 연찬회 사진`;
  counter.textContent = `${currentIndex+1} / ${end-start+1}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = number === end;
}

function nextSlide(){
  if(!currentGroup) return;
  const end = currentGroup.range[1];
  if(currentGroup.range[0] + currentIndex < end){
    currentIndex++;
    updateSlide();
  }
}

function prevSlide(){
  if(!currentGroup) return;
  if(currentIndex > 0){
    currentIndex--;
    updateSlide();
  }
}

function goHome(){
  currentGroup = null;
  home.classList.remove("hidden");
  members.classList.add("hidden");
  viewer.classList.add("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
