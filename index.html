<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ddeb">
<title>박문지부 영무궁화 연찬회</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#fff8fb,#f3faff,#fffdf4);color:#625a65}
.wrap{width:100%;max-width:920px;margin:auto;padding:14px 12px 30px}
h1{text-align:center;color:#765f79;font-size:clamp(25px,7vw,40px);margin:8px 0 18px;letter-spacing:-1.5px}
.card{background:#ffffffee;border:1px solid #eadfea;border-radius:22px;padding:12px;box-shadow:0 8px 24px rgba(100,80,110,.09)}
.main{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:15px;background:#faf8fb}
.click{display:inline-block;margin:16px auto 3px;padding:14px 38px;border-radius:999px;background:#f0d9ec;color:#765d72;font-size:18px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.person{background:linear-gradient(#fff,#fff8fc);border:1px solid #eadfea;border-radius:18px;padding:15px 4px 13px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(100,80,110,.06);-webkit-tap-highlight-color:transparent}
.person:active{transform:scale(.97)}
.dessert{font-size:46px;line-height:1.1}.num{font-weight:800;font-size:16px;margin-top:7px}.name{font-size:14px;color:#aaa1ab;margin-top:4px}
.viewer-title{text-align:center;font-size:19px;font-weight:800;color:#765f79;margin:2px 0 10px}
.slidebox{height:68vh;min-height:400px;display:flex;align-items:center;justify-content:center;background:#faf9fc;border-radius:15px;padding:5px}
.slide{max-width:100%;max-height:100%;object-fit:contain;border-radius:9px}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:999px;padding:12px 17px;font-size:15px;font-weight:800;cursor:pointer;min-height:44px}
.prev{background:#e9eef8;color:#626b7c}.next{background:#f0d8e7;color:#765b6d}.home{background:#e2f1ea;color:#5e7067}
.counter{margin-right:auto;color:#aaa1ab;font-size:14px}
button:disabled{opacity:.35}
.hidden{display:none!important}
@media(max-width:560px){
 .wrap{padding:10px 8px 25px} h1{font-size:28px;margin:6px 0 14px}
 .card{padding:9px;border-radius:18px}.grid{gap:7px}.person{padding:12px 2px 11px}
 .dessert{font-size:38px}.num{font-size:15px}.name{font-size:13px}
 .slidebox{height:63vh;min-height:0}.controls{justify-content:center}
 .counter{width:100%;text-align:center;order:-1}
 button{padding:12px 15px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>
  박문지부 영무궁화 연찬회
  <small>(신인간혁명 9권)</small></h1>

<section id="home" class="card" style="text-align:center">
<img class="main" src="박문 사진/슬라이드1.PNG" alt="슬라이드1">
<div class="click" onclick="showMembers()">👆 클릭</div>
</section>

<section id="members" class="card hidden">
<div class="grid" id="grid"></div>
</section>

<section id="viewer" class="card hidden">
<div class="viewer-title" id="title"></div>
<div class="slidebox"><img id="slide" class="slide" alt=""></div>
<div class="controls">
<div class="counter" id="counter"></div>
<button class="prev" id="prev" onclick="move(-1)">← 이전</button>
<button class="next" id="next" onclick="move(1)">다음 →</button>
<button class="home" onclick="goHome()">🏠 첫 화면</button>
</div>
</section>
</div>

<script>
const groups=[
[1,"🍰",2,11],[2,"🍮",12,20],[3,"🍩",21,27],
[4,"🧁",28,33],[5,"🍪",34,42],[6,"🍓",43,51],
[7,"🍨",52,60],[8,"🍫",61,70],[9,"🍧",71,78]
];
let group=null,index=0;
const $=id=>document.getElementById(id);

groups.forEach(g=>{
 const el=document.createElement("div");
 el.className="person";
 el.innerHTML='<div class="dessert">'+g[1]+'</div><div class="num">'+g[0]+'번</div><div class="name">( 이름 )</div>';
 el.onclick=()=>openGroup(g[0]);
 $("grid").appendChild(el);
});

function hideAll(){
 $("home").classList.add("hidden");
 $("members").classList.add("hidden");
 $("viewer").classList.add("hidden");
}
function showMembers(){
 hideAll();$("members").classList.remove("hidden");window.scrollTo(0,0);
}
function openGroup(n){
 group=groups.find(g=>g[0]===n);index=0;
 hideAll();$("viewer").classList.remove("hidden");update();window.scrollTo(0,0);
}
function update(){
 const no=group[2]+index;
 $("slide").src='박문 사진/슬라이드'+no+'.PNG';
 $("slide").alt='슬라이드'+no;
 $("title").textContent=group[0]+'번 · 연찬회 사진';
 $("counter").textContent=(index+1)+' / '+(group[3]-group[2]+1);
 $("prev").disabled=index===0;
 $("next").disabled=no===group[3];
}
function move(dir){
 const ni=index+dir;
 if(ni<0 || group[2]+ni>group[3]) return;
 index=ni;update();
}
function goHome(){
 group=null;index=0;hideAll();$("home").classList.remove("hidden");window.scrollTo(0,0);
}
</script>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
