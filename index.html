<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="박문 사진">
  <meta property="og:description" content="박문 사진을 확인해 보세요.">
  <meta property="og:image" content="https://acok77777.github.io/Bak-Moon/%EB%B0%95%EB%AC%B8%20%EC%82%AC%EC%A7%84/%EC%8A%AC%EB%9D%BC%EC%9D%B4%EC%8A%A41.png">
  <meta property="og:image:alt" content="박문 슬라이스1 사진">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="박문 사진">
  <meta name="twitter:description" content="박문 사진을 확인해 보세요.">
  <meta name="twitter:image" content="https://acok77777.github.io/Bak-Moon/%EB%B0%95%EB%AC%B8%20%EC%82%AC%EC%A7%84/%EC%8A%AC%EB%9D%BC%EC%9D%B4%EC%8A%A41.png">
  <title>박문</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="homeScreen" class="screen home-screen">
      <div class="title-card">
        <div class="small-title">박문 사진</div>
        <h1>박문</h1>
        <p>원하는 번호를 눌러 사진을 확인해 보세요</p>
      </div>

      <button id="startButton" class="main-photo-button" aria-label="슬라이스1 사진 열기">
        <img src="./박문 사진/슬라이스1.png" alt="슬라이스1">
      </button>
      <button id="clickText" class="click-text">클릭</button>

      <div class="people-grid" aria-label="9명 선택">
        <button class="person-card" data-person="1"><span class="emoji">🍰</span><span>1번 ( 이름 )</span></button>
        <button class="person-card" data-person="2"><span class="emoji">🧁</span><span>2번 ( 이름 )</span></button>
        <button class="person-card" data-person="3"><span class="emoji">🍩</span><span>3번 ( 이름 )</span></button>
        <button class="person-card" data-person="4"><span class="emoji">🍪</span><span>4번 ( 이름 )</span></button>
        <button class="person-card" data-person="5"><span class="emoji">🍮</span><span>5번 ( 이름 )</span></button>
        <button class="person-card" data-person="6"><span class="emoji">🍓</span><span>6번 ( 이름 )</span></button>
        <button class="person-card" data-person="7"><span class="emoji">🍫</span><span>7번 ( 이름 )</span></button>
        <button class="person-card" data-person="8"><span class="emoji">🍭</span><span>8번 ( 이름 )</span></button>
        <button class="person-card" data-person="9"><span class="emoji">🍨</span><span>9번 ( 이름 )</span></button>
      </div>
    </section>

    <section id="viewerScreen" class="screen viewer-screen hidden">
      <div class="viewer-header">
        <button id="homeButton" class="home-button">⌂ 첫 화면</button>
        <div id="viewerTitle" class="viewer-title">사진 보기</div>
      </div>

      <div class="viewer-card">
        <div class="photo-frame">
          <img id="viewerImage" src="" alt="사진">
          <div id="imageError" class="image-error hidden">
            사진 파일을 찾을 수 없습니다.<br>
            <small>파일명과 <b>박문 사진</b> 폴더를 확인해 주세요.</small>
          </div>
        </div>

        <div class="viewer-footer">
          <span id="pageInfo">1 / 1</span>
          <button id="nextButton" class="next-button">넘기기 ▶</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
