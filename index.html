<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6ddeb">
<title>박문지부 영무궁화 연찬회</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fb,#f3faff,#fffdf4);font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:#655d68}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{text-align:center;color:#765f79;font-size:clamp(25px,6vw,40px);margin:8px 0 20px}
.card{background:#ffffffdd;border:1px solid #eadfea;border-radius:24px;padding:16px;box-shadow:0 10px 28px #8c78901a}
.main{width:100%;max-height:68vh;object-fit:contain;border-radius:17px;background:#faf8fb}
.click{display:inline-block;margin:18px auto 4px;padding:13px 35px;border-radius:30px;background:#f1dcec;color:#765e72;font-weight:800;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.person{border:1px solid #eadfea;border-radius:19px;background:linear-gradient(#fff,#fff8fc);padding:16px 5px;text-align:center;cursor:pointer;transition:.18s}
.person:hover{transform:translateY(-3px);box-shadow:0 8px 18px #8c789018}
.dessert{font-size:48px;line-height:1.1}.num{font-weight:800;margin-top:8px}.name{font-size:14px;color:#aaa2ab;margin-top:5px}
.viewer-title{text-align:center;font-weight:800;color:#766477;font-size:19px;margin-bottom:12px}
.slidebox{height:68vh;display:flex;align-items:center;justify-content:center;background:#faf9fc;border-radius:17px;padding:8px}
.slide{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:24px;padding:11px 17px;font-weight:800;cursor:pointer}
.prev{background:#e9eef8;color:#626b7c}.next{background:#f1d8e7;color:#765b6d}.home{background:#e2f1ea;color:#5e7067}
.counter{margin-right:auto;color:#aaa1ab;font-size:14px}
.hidden{display:none}
@media(max-width:560px){.wrap{padding:10px}.card{padding:11px;border-radius:18px}.grid{gap:8px}.person{padding:13px 3px}.dessert{font-size:38px}.slidebox{height:62vh}.counter{width:100%;text-align:center}.controls{justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
<h1>박문지부 영무궁화 연찬회</h1>

<section id="home" class="card" style="text-align:center">
<img class="main" src="박문 사진/슬라이스1.png" alt="슬라이스1" onerror="this.alt='박문 사진 폴더의 슬라이스1.png를 확인해주세요'">
<div class="click" onclick="showMembers()">👆 클릭</div>
</section>

<section id="members" class="card hidden">
<div class="grid" id="grid"></div>
</section>

<section id="viewer" class="card hidden">
<div class="viewer-title" id="title"></div>
<div class="slidebox"><img id="slide" class="slide" alt=""></div>
<div class="controls">
<div class="counter" id="counter"></div>
<button class="prev" id="prev" onclick="move(-1)">← 이전</button>
<button class="next" id="next" onclick="move(1)">다음 →</button>
<button class="home" onclick="home()">🏠 첫 화면</button>
</div>
</section>
</div>

<script>
const groups=[
[1,"🍰",2,11],[2,"🍮",12,20],[3,"🍩",21,27],
[4,"🧁",28,33],[5,"🍪",34,42],[6,"🍓",43,51],
[7,"🍨",52,60],[8,"🍫",61,70],[9,"🍧",71,78]
];
let g=null,i=0;
const $=id=>document.getElementById(id);
groups.forEach(x=>{
 const d=document.createElement("div");d.className="person";
 d.innerHTML=`<div class="dessert">${x[1]}</div><div class="num">${x[0]}번</div><div class="name">( 이름 )</div>`;
 d.onclick=()=>openGroup(x[0]);$("grid").appendChild(d);
});
function hideAll(){$("home").classList.add("hidden");$("members").classList.add("hidden");$("viewer").classList.add("hidden")}
function showMembers(){hideAll();$("members").classList.remove("hidden");scrollTo(0,0)}
function openGroup(n){g=groups.find(x=>x[0]===n);i=0;hideAll();$("viewer").classList.remove("hidden");update();scrollTo(0,0)}
function update(){
 let no=g[2]+i;
 $("slide").src=`박문 사진/슬라이스${no}.png`;
 $("slide").alt=`슬라이스${no}`;
 $("title").textContent=`${g[0]}번 · 연찬회 사진`;
 $("counter").textContent=`${i+1} / ${g[3]-g[2]+1}`;
 $("prev").disabled=i===0;$("next").disabled=no===g[3];
}
function move(dir){let ni=i+dir;if(ni<0||g[2]+ni>g[3])return;i=ni;update()}
function home(){g=null;i=0;hideAll();$("home").classList.remove("hidden");scrollTo(0,0)}
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body>
</html>
